services:
    db:
        image: postgres:16-alpine
        container_name: prompt-market-db
        environment:
            POSTGRES_USER: user
            POSTGRES_PASSWORD: password
            POSTGRES_DB: prompt_market
        ports:
            - "5432:5432"
        volumes:
            - prompt_market_pgdata:/var/lib/postgresql/data

volumes:
    prompt_market_pgdata:
